name: Visual examples
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.10.10'
      - run: uv sync --frozen
      - run: uv run python -m evaluation.run --mode fixture
      - name: Install isolated document-rendering tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu-core
      - run: uv run python -m evaluation.render
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docx-visual-examples
          path: |
            evaluation/previews/*.png
            evaluation/output/results.json
