name: Visual examples
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.10.10'
      - run: uv sync --frozen
      - run: uv run python -m evaluation.run --mode fixture
      - name: Install isolated document-rendering tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu-core
      - run: uv run python -m evaluation.render
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docx-visual-examples
          path: |
            evaluation/previews/*.png
            evaluation/output/results.json
